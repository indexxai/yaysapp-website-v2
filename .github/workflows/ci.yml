name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.0.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: MongoDB 7 and Redis
        run: |
          curl -fsSL https://www.mongodb.org/static/pgp/server-7.0.asc | sudo gpg -o /usr/share/keyrings/mongodb-server-7.0.gpg --dearmor
          echo "deb [ signed-by=/usr/share/keyrings/mongodb-server-7.0.gpg ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          sudo apt-get update && sudo apt-get install -y mongodb-org-server redis-server
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yays/tokens build && pnpm --filter @yays/shared build
      - run: pnpm -r --if-present typecheck
      - run: pnpm --filter @yays/tokens test && pnpm --filter @yays/shared test
      - name: Backend end-to-end (real MongoDB replica set + Redis)
        run: pnpm --filter @yays/api test:e2e
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - name: Web end-to-end (browser + API + database)
        run: pnpm --filter @yays/web test:e2e
      - name: Landing end-to-end
        run: pnpm --filter @yays/landing test:e2e
      - name: Mobile tests (screens against the live API)
        run: pnpm --filter @yays/mobile test && pnpm --filter @yays/mobile test:e2e
